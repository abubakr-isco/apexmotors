<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex Motors</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Размытые пятна-свечения на фоне -->
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="glow glow-3"></div>

  <div class="page">
    <header class="header">
      <a href="#" class="logo">
        <span class="logo-icon">A</span>
        <span class="logo-text">APEX <span>MOTORS</span></span>
      </a>

      <nav class="tabs">
        <button class="tab active" data-brand="mercedes" onclick="selectBrand('mercedes')">Mercedes</button>
        <button class="tab" data-brand="bmw" onclick="selectBrand('bmw')">BMW</button>
        <button class="tab" data-brand="porsche" onclick="selectBrand('porsche')">Porsche</button>
      </nav>
    </header>

    <main>
      <section class="heading">
        <div>
          <p class="eyebrow">Коллекция 2026</p>
          <h1 class="brand-title">Mercedes-Benz</h1>
        </div>
        <p class="models-count"></p>
      </section>

      <div class="cards"></div>
    </main>
  </div>

  <!-- Модальное окно -->
  <div class="modal">
    <div class="modal-window">
      <button class="modal-close" onclick="closeModal()" aria-label="Закрыть">&times;</button>
      <div class="modal-content"></div>
    </div>
  </div>

  <!-- Axios подключаем ДО своего скрипта -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
